# Configuración de Netlify para Gals Panic Phaser 3

[build]
  # Comando para construir el proyecto
  command = "npm run build"
  # Directorio donde se generan los archivos estáticos
  publish = "dist"

# Configuración para SPA (Single Page Application)
# Redirige todas las rutas al index.html para que funcione el routing del juego
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de seguridad y optimización
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Headers específicos para assets estáticos (caché)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers para el HTML (sin caché para siempre tener la última versión)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

